mode: nanovlm

vlm:
  vlm_checkpoint_path: "lusxvr/nanoVLM-450M"
  lm_max_length: 4096
  max_img_size: 1536
  activation_checkpointing: false
  activation_checkpointing_mode: "regular"

train:
  lr_mp: 0.0005
  lr_language_backbone: 0.0001
  lr_vision_backbone: 0.0
  batch_size: 4
  gradient_accumulation_steps: 16
  stop_unit: "steps"                # "steps" | "tokens"
  max_training_steps: 20000         # set when stop_unit="steps"
  max_training_tokens: null         # set when stop_unit="tokens"
  eval_unit: "steps"                # "steps" | "tokens"
  eval_in_epoch: false
  eval_interval: 500                # set when eval_unit="steps"
  eval_interval_tokens: null        # set when eval_unit="tokens"
  checkpoint_unit: "steps"          # "steps" | "tokens"
  checkpoint_interval: 500          # set when checkpoint_unit="steps"
  checkpoint_interval_tokens: null  # set when checkpoint_unit="tokens"
  checkpoint_repo_pattern: "patrickamadeus/dt8k1img-ref-step-{i}"
  train_dataset_path: "patrickamadeus/the_cauldron"
  train_dataset_name:
    - default
  train_split: "train"
  val_split: "validation"
  use_packing: true
  stream_dataset: true
  compile: false
  wandb_project: "dualtower"
  wandb_run_name_prefix: "debug"
  log_wandb: true
